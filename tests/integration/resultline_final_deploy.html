<!doctype html><meta charset="utf-8"><title>RESULTLINE Final Deployment</title>
<button id="connect">Connect Deployment Wallet</button><button id="prepare" disabled>Prepare Final Deployment — Read Only</button><button id="deploy" disabled>Deploy Final RESULTLINE</button><pre id="out"></pre>
<script type="module">
const DEPLOYER='0xaffe15eec45b68835cc9e5b4ab85dd5deae8e70b',RPC='https://studio-dev.genlayer.com/api',HASH='b142353bff1cf058b8329440f20467b18f89f299';let account,source,quote;const out=x=>document.querySelector('#out').textContent=typeof x==='string'?x:JSON.stringify(x,null,2);const kit=async()=>{const{createTransactionKit}=await import('https://esm.sh/@genlayer/transaction-kit@0.1.0-rc.2');const{studioDevnet}=await import('https://esm.sh/genlayer-js@2.0.0-rc.1/chains');return createTransactionKit({chain:studioDevnet,account,provider:window.ethereum})};const sha1=async s=>{const b=new TextEncoder().encode(s),d=await crypto.subtle.digest('SHA-1',new TextEncoder().encode(`blob ${b.length}\0${s}`));return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')};connect.onclick=async()=>{try{account=(await ethereum.request({method:'eth_requestAccounts'}))[0];const chain=BigInt(await ethereum.request({method:'eth_chainId'}));prepare.disabled=!(account.toLowerCase()===DEPLOYER&&chain===61997n);out({account,chain:chain.toString(),rpc:RPC,network:'Studio Next / studio-dev',gates:{account:account.toLowerCase()===DEPLOYER?'PASS':'FAIL',chain:chain===61997n?'PASS':'FAIL',rpc:'PASS'}})}catch(e){out('CONNECT FAILED '+e.message)}};prepare.onclick=async()=>{try{const chain=BigInt(await ethereum.request({method:'eth_chainId'}));source=await(await fetch('/contracts/resultline.py',{cache:'no-store'})).text();const sourceHash=await sha1(source),g={account:account?.toLowerCase()===DEPLOYER,chain:chain===61997n,rpc:RPC==='https://studio-dev.genlayer.com/api',sourceHash:sourceHash===HASH,eoaPayoutCode:source.includes('@gl.evm.contract_interface')&&source.includes('emit_transfer(value=gl.u256(amount))'),oldInternalPayoutCodeAbsent:!source.includes('gl.contract.get_at(gl.message.sender_address).emit_transfer')};if(!Object.values(g).every(Boolean))throw Error('Preparation gate failed');quote=await(await kit()).estimate({userValue:0n},{kind:'deploy',code:source,args:[]});if(quote.verification?.status!=='verified'||quote.userValue!==0n)throw Error('Fee quote invalid');deploy.disabled=false;out({account:'PASS',chain:'PASS',rpc:'PASS',sourceHash:'PASS',eoaPayoutCode:'PASS',oldInternalPayoutCodeAbsent:'PASS',protocolFeeWei:quote.feeValue.toString(),feeVerification:quote.verification.status,contractValue:'0'})}catch(e){deploy.disabled=true;out('PREPARATION FAILED '+e.message)}};deploy.onclick=async()=>{deploy.disabled=true;out('REQUESTING METAMASK DEPLOYMENT CONFIRMATION');try{const r=await(await kit()).submit(quote,{kind:'deploy',code:source,args:[]}),id=r?.genlayerTxId;if(typeof id!=='string')throw Error('No GenLayer transaction ID returned');localStorage.setItem('resultline.finalDeployment',JSON.stringify({genlayerTxId:id,returned:r,at:new Date().toISOString()}));console.log('RESULTLINE FINAL DEPLOYMENT SUBMITTED',r);out({status:'SUBMITTED',genlayerTxId:id,returned:r})}catch(e){out('DEPLOYMENT FAILED '+e.message)}};
</script>
