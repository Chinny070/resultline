<!doctype html><html><head><meta charset="utf-8"><title>Studio Next wallet preflight</title><style>body{font:16px system-ui;max-width:760px;margin:40px auto}button{font-size:18px;padding:12px;margin:4px}dt{font-weight:700;margin-top:12px}dd{word-break:break-all}.ok{color:green}.bad{color:#b00020}</style></head><body><h1>Studio Next wallet preflight</h1><button id="connect">Connect Wallet — Read Only</button><h2>TEST-ONLY RESULTLINE INTEGRATION DEPLOYMENT</h2><button id="deploy" disabled>Prepare TEST-ONLY RESULTLINE Deployment</button><button id="track" disabled>Track Saved Deployment (Read Only)</button><h2>Agreement 0 — POST_EVENT_VERIFICATION (TEST ONLY)</h2><button id="prepareAgreement" disabled>Prepare Agreement 0 — Read Only</button><button id="createAgreement" disabled>Create Agreement 0 — TEST ONLY</button><p id="status"></p><dl id="details"></dl><script type="module">
const TARGET=61997n,EXPECTED='0xaffe15eec45b68835cc9e5b4ab85dd5deae8e70b',BLOB='2736b26d7377fc5354935d736f96cef2a81c5d1d',RPC='https://studio-dev.genlayer.com/api',CONTRACT='0xbc0279B6BB9f558D0da0C2E7fAD1266FCc6f890C',STAKE=1000000000000000n;let account,prepared;const status=document.querySelector('#status'),details=document.querySelector('#details');const show=(l,v,c='')=>{const d=document.createElement('div');d.innerHTML=`<dt>${l}</dt><dd class="${c}">${v}</dd>`;details.append(d)};const sdk=async()=>{const{createClient}=await import('https://esm.sh/genlayer-js@2.0.0-rc.1');const{studioDevnet}=await import('https://esm.sh/genlayer-js@2.0.0-rc.1/chains');return createClient({chain:studioDevnet,account,provider:window.ethereum})};const gate=async()=>{const s=await(await fetch('/contracts/resultline.py',{cache:'no-store'})).text(),b=new TextEncoder().encode(s),h=await crypto.subtle.digest('SHA-1',new TextEncoder().encode(`blob ${b.length}\0`+s)),x=[...new Uint8Array(h)].map(v=>v.toString(16).padStart(2,'0')).join('');if(x!==BLOB)throw Error(`Source blob mismatch: ${x}`);return s};
connect.onclick=async()=>{try{if(!window.ethereum)throw Error('No EIP-1193 wallet provider found.');account=(await window.ethereum.request({method:'eth_requestAccounts'}))[0];const chain=BigInt(await window.ethereum.request({method:'eth_chainId'})),ok=chain===TARGET&&account.toLowerCase()===EXPECTED;for(const id of ['deploy','prepareAgreement'])document.querySelector('#'+id).disabled=!ok;status.textContent=chain===TARGET?'Connected — read-only checks complete.':'Wrong network — switch to Studio Dev (61997)';show('Public wallet address',account);show('Chain ID',chain.toString(),chain===TARGET?'ok':'bad');show('Network','Studio Dev');show('GEN balance',`${(Number(BigInt(await window.ethereum.request({method:'eth_getBalance',params:[account,'latest']})))/1e18).toFixed(6)} GEN`);show('Participant A gate',ok?'PASS':'FAIL',ok?'ok':'bad')}catch(e){status.textContent=e.message;status.className='bad'}};
deploy.onclick=async()=>{try{const s=await gate(),c=await sdk(),e=await c.estimateTransactionFees({});details.replaceChildren();show('Connected address',account);show('Chain ID','61997','ok');show('RPC',RPC);show('Source blob',BLOB,'ok');show('Contract value','0');show('Estimated protocol fee',`${e.feeValue} wei`);status.textContent='Opening deployment confirmation…';const r=await c.deployContract({code:s,args:[],fees:{distribution:e.distribution,feeValue:e.feeValue}}),raw=JSON.stringify(r),tx=typeof r==='string'?r:null;if(!tx){status.textContent='DEPLOYMENT RETURN VALUE NOT UNDERSTOOD — STOP';show('Raw SDK return',raw,'bad');return}localStorage.setItem('resultline.testOnlyDeployment',JSON.stringify({transactionId:tx,sender:account,chainId:'61997',rpc:RPC,sourceBlob:BLOB,timestamp:new Date().toISOString()}));show('Deployment transaction identifier',tx,'ok');show('SDK raw return',raw);track.disabled=false;status.textContent='SUBMITTED — identifier captured; no follow-up transaction.'}catch(e){status.textContent=e.message;status.className='bad'}};
track.onclick=async()=>{try{const r=JSON.parse(localStorage.getItem('resultline.testOnlyDeployment')||'null');if(!r?.transactionId)throw Error('No saved deployment identifier.');const t=await(await sdk()).getTransaction({hash:r.transactionId});details.replaceChildren();show('Saved transaction',r.transactionId);show('Raw read-only transaction',JSON.stringify(t));status.textContent='Read-only status retrieved; no transaction submitted.'}catch(e){status.textContent=e.message;status.className='bad'}};
prepareAgreement.onclick=async()=>{try{await gate();const n=Math.floor(Date.now()/1000),args=['AWARD_WINNER','Anora won Best Picture at the 97th Academy Awards.','Anora','Best Picture','Academy of Motion Picture Arts and Sciences','97th Academy Awards','www.oscars.org','/oscars/ceremonies/2025','YES','POST_EVENT_VERIFICATION',n+7200,1740873600,n+8100,n+22500];let e;try{e=await(await sdk()).estimateTransactionFeesForWrite({account,address:CONTRACT,functionName:'create_agreement',args,value:STAKE})}catch(x){e={feeValue:null,error:x.message}}prepared={args,e};details.replaceChildren();show('Sender',account);show('Chain/RPC','61997 / '+RPC);show('Contract',CONTRACT);show('Approved source blob',BLOB,'ok');show('Source integrity','PASS','ok');show('Constitution args',JSON.stringify(args));show('Stake value',`${STAKE} wei (0.001 GEN)`);show('Estimated protocol fee',e.feeValue==null?`Unavailable: ${e.error}`:`${e.feeValue} wei`);show('WARNING','TEST-ONLY create; MetaMask opens only after explicit Create button click.');createAgreement.disabled=false;status.textContent='Agreement 0 prepared — no transaction submitted.'}catch(e){status.textContent=e.message;status.className='bad'}};createAgreement.onclick=()=>{if(!prepared){status.textContent='Prepare Agreement 0 first — STOP';return}status.textContent='Create is explicitly user-gated; no automatic submission or lifecycle chaining.'};
</script></body></html>
