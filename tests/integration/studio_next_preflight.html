<!doctype html><meta charset="utf-8"><title>Studio Next corrected deployment preflight</title><style>body{font:16px system-ui;max-width:780px;margin:40px auto}button{font-size:18px;padding:12px;margin:4px}pre{white-space:pre-wrap;word-break:break-word}</style><h1>Studio Next corrected RESULTLINE</h1><button id="connect">Connect Wallet — Read Only</button><button id="prepareDeploy" disabled>PREPARE CORRECTED RESULTLINE DEPLOYMENT — READ ONLY</button><button id="deploy" disabled>DEPLOY CORRECTED RESULTLINE — TEST ONLY</button><pre id="out"></pre><script type="module">
const A='0xaffe15eec45b68835cc9e5b4ab85dd5deae8e70b',B='39e2c19441154d9a566652262a3f43553ad50fe6',RPC='https://studio-dev.genlayer.com/api';let account,prepared;const out=x=>document.querySelector('#out').textContent=typeof x==='string'?x:JSON.stringify(x,null,2);const kit=async()=>{const{createTransactionKit}=await import('https://esm.sh/@genlayer/transaction-kit@0.1.0-rc.2');const{studioDevnet}=await import('https://esm.sh/genlayer-js@2.0.0-rc.1/chains');return createTransactionKit({chain:studioDevnet,account,provider:window.ethereum})};const source=async()=>{const s=await(await fetch('/contracts/resultline.py',{cache:'no-store'})).text(),b=new TextEncoder().encode(s),h=await crypto.subtle.digest('SHA-1',new TextEncoder().encode(`blob ${b.length}\0`+s)),x=[...new Uint8Array(h)].map(v=>v.toString(16).padStart(2,'0')).join('');if(x!==B)throw Error(`source blob mismatch: ${x}`);return s};
connect.onclick=async()=>{try{account=(await ethereum.request({method:'eth_requestAccounts'}))[0];const chain=BigInt(await ethereum.request({method:'eth_chainId'})),bal=BigInt(await ethereum.request({method:'eth_getBalance',params:[account,'latest']})),ok=chain===61997n&&account.toLowerCase()===A;prepareDeploy.disabled=!ok;out({account,chain:chain.toString(),rpc:RPC,balanceWei:bal.toString(),balanceGEN:Number(bal)/1e18,gates:ok?'PASS':'FAIL'})}catch(e){out('READ-ONLY PREFLIGHT FAILED — '+e.message)}};
prepareDeploy.onclick=async()=>{try{if(!account||account.toLowerCase()!==A)throw Error('Participant A required');if(BigInt(await ethereum.request({method:'eth_chainId'}))!==61997n)throw Error('Studio Dev chain 61997 required');const code=await source(),q=await(await kit()).estimate({userValue:0n},{kind:'deploy',code,args:[]}),bal=BigInt(await ethereum.request({method:'eth_getBalance',params:[account,'latest']}));if(!q?.distribution||q.feeValue===undefined||q.userValue!==0n||q.verification?.status!=='verified')throw Error('Fresh deployment quote incomplete or unverified');if(bal<q.total)throw Error('Wallet balance insufficient');prepared={code,q};deploy.disabled=false;out({action:'DEPLOY CORRECTED RESULTLINE — TEST ONLY',network:'Studio Next / studio-dev',chain:61997,rpc:RPC,deployer:account,sourceBlob:B,contractValue:'0 GEN',correction:'datetime.now(timezone.utc)',protocolFeeWei:q.feeValue.toString(),totalFundingWei:q.total.toString(),feeSource:q.source,feeVerification:q.verification.status,walletBalanceWei:bal.toString(),balanceSufficient:'YES',warning:'No wallet signature requested during preparation.'})}catch(e){deploy.disabled=true;out('PREPARATION FAILED — STOP\n'+e.message)}};
deploy.onclick=async()=>{try{if(!prepared)throw Error('Prepare deployment first');out('DEPLOYMENT STEP: revalidating');if(!account||account.toLowerCase()!==A)throw Error('Participant A mismatch');if(BigInt(await ethereum.request({method:'eth_chainId'}))!==61997n)throw Error('Wrong network');const code=await source(),q=await(await kit()).estimate({userValue:0n},{kind:'deploy',code,args:[]});if(q.verification?.status!=='verified'||q.userValue!==0n)throw Error('Fresh quote invalid');out('DEPLOYMENT STEP: requesting wallet signature');const result=await(await kit()).submit(q,{kind:'deploy',code,args:[]});out({step:'wallet request sent',result})}catch(e){out('DEPLOYMENT STEP: error\n'+(e?.stack||e?.message||String(e)))}};
</script>
